
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Speed Master</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #10172a, #243b65);
    min-height: 100vh;
    padding: 25px 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #222;
}

.container {
    width: 100%;
    max-width: 950px;
    background: white;
    padding: clamp(18px, 4vw, 40px);
    border-radius: 22px;
    box-shadow: 0 20px 60px #0005;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: clamp(25px, 5vw, 38px);
    color: #243b65;
}

.header p {
    color: #777;
    margin-top: 8px;
    font-size: 15px;
}

.controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 22px;
}

.controls select {
    padding: 11px 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    background: white;
    max-width: 100%;
}

.timer {
    background: #edf2ff;
    padding: 12px 20px;
    border-radius: 10px;
    color: #315dcc;
    font-weight: bold;
}

.text-box {
    background: #f5f7fc;
    border: 1px solid #e1e7f0;
    padding: clamp(16px, 3vw, 25px);
    border-radius: 13px;
    margin-bottom: 18px;
    line-height: 2;
    font-size: clamp(15px, 2vw, 19px);
    min-height: 135px;
    overflow-wrap: anywhere;
}

.correct {
    color: #16a36a;
}

.wrong {
    color: #e74c3c;
    background: #ffe4e4;
    border-radius: 3px;
}

.current {
    border-bottom: 3px solid #3867d6;
}

#typingInput {
    width: 100%;
    min-height: 135px;
    padding: 17px;
    border: 2px solid #dce3ee;
    border-radius: 12px;
    outline: none;
    font-size: 17px;
    font-family: inherit;
    resize: vertical;
    transition: .3s;
}

#typingInput:focus {
    border-color: #3867d6;
    box-shadow: 0 0 0 3px #3867d622;
}

.progress-container {
    width: 100%;
    height: 9px;
    background: #e8edf5;
    border-radius: 20px;
    margin: 18px 0 25px;
    overflow: hidden;
}

#progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3867d6, #16c79a);
    border-radius: 20px;
    transition: width .2s;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: #f5f7fc;
    padding: 20px 8px;
    text-align: center;
    border-radius: 12px;
    border: 1px solid #edf0f5;
}

.stat h2 {
    color: #3867d6;
    font-size: clamp(21px, 4vw, 30px);
}

.stat p {
    color: #777;
    font-size: 13px;
    margin-top: 7px;
}

.buttons {
    display: flex;
    gap: 12px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 14px 20px;
    background: #3867d6;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
    flex: 1;
}

button:hover {
    background: #244da9;
    transform: translateY(-2px);
}

#resetBtn {
    background: #e74c3c;
}

#resetBtn:hover {
    background: #c0392b;
}

#result {
    display: none;
    text-align: center;
    padding: 22px;
    margin-top: 20px;
    background: #edfff6;
    border: 1px solid #b8ebd0;
    border-radius: 12px;
}

#result h2 {
    color: #168653;
    margin-bottom: 10px;
}

#result p {
    line-height: 1.8;
}

.footer {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-top: 25px;
}

/* Tablet */
@media(max-width: 700px) {
    body {
        padding: 15px 10px;
        align-items: flex-start;
    }

    .container {
        margin: auto 0;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .controls {
        align-items: stretch;
    }

    .controls select {
        flex: 1;
    }
}

/* Mobile */
@media(max-width: 420px) {
    .container {
        padding: 17px 13px;
        border-radius: 15px;
    }

    .header {
        margin-bottom: 20px;
    }

    .controls {
        flex-direction: column;
    }

    .timer {
        text-align: center;
    }

    .text-box {
        min-height: 150px;
    }

    #typingInput {
        min-height: 120px;
        font-size: 15px;
    }

    .stats {
        gap: 9px;
    }

    .stat {
        padding: 15px 5px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>⌨ Typing Speed Master</h1>
        <p>Improve your typing speed, accuracy and skills!</p>
    </div>

    <div class="controls">
        <select id="difficulty">
            <option value="easy">Easy Level</option>
            <option value="medium" selected>Medium Level</option>
            <option value="hard">Hard Level</option>
        </select>

        <select id="duration">
            <option value="30">30 Seconds</option>
            <option value="60" selected>60 Seconds</option>
            <option value="120">2 Minutes</option>
            <option value="300">5 Minutes</option>
        </select>

        <div class="timer">
            ⏱ Time: <span id="time">60</span>s
        </div>
    </div>

    <div class="text-box" id="textDisplay"></div>

    <textarea id="typingInput"
        placeholder="Click here and start typing..."
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"></textarea>

    <div class="progress-container">
        <div id="progress"></div>
    </div>

    <div class="stats">

        <div class="stat">
            <h2 id="wpm">0</h2>
            <p>Words Per Minute</p>
        </div>

        <div class="stat">
            <h2 id="accuracy">100%</h2>
            <p>Accuracy</p>
        </div>

        <div class="stat">
            <h2 id="mistakes">0</h2>
            <p>Mistakes</p>
        </div>

        <div class="stat">
            <h2 id="characters">0</h2>
            <p>Characters</p>
        </div>

    </div>

    <div class="buttons">
        <button id="startBtn" onclick="startTest()">Start Test</button>
        <button id="resetBtn" onclick="resetTest()">Restart</button>
    </div>

    <div id="result">
        <h2>🎉 Test Completed!</h2>
        <p id="resultDetails"></p>
    </div>

    <div class="footer">
        Typing Speed Master | Practice Daily & Improve Your Skills
    </div>

</div>

<script>

const passages = {
    easy: [
        "I love learning new things every day. Practice makes us better. Keep working hard and never give up on your dreams.",
        "The sun rises in the east and sets in the west. Every morning is a new chance to learn something useful.",
        "Typing is an important computer skill. Practice every day to improve your speed and accuracy."
    ],

    medium: [
        "Technology is changing the world rapidly. Computers, smartphones and the internet help people communicate, learn and work efficiently.",
        "Success does not come overnight. It requires dedication, patience, discipline and consistent effort. Keep improving yourself every day.",
        "Web development allows creative people to build amazing websites using HTML, CSS and JavaScript."
    ],

    hard: [
        "JavaScript developers create interactive applications using functions, objects, arrays, asynchronous operations and modern programming techniques.",
        "Responsive web design ensures that applications automatically adjust their layouts according to different screen sizes and device resolutions.",
        "Programming requires logical thinking, problem-solving abilities, creativity and continuous learning to build reliable digital experiences."
    ]
};

let targetText = "";
let timeLeft = 60;
let totalDuration = 60;
let timer = null;
let started = false;
let finished = false;
let startTime = null;

const input = document.getElementById("typingInput");

function loadPassage() {
    const level = document.getElementById("difficulty").value;
    const list = passages[level];

    targetText = list[Math.floor(Math.random() * list.length)];

    displayText();
}

function displayText() {

    const typed = input.value;
    let html = "";

    for (let i = 0; i < targetText.length; i++) {

        let className = "";

        if (i < typed.length) {
            className = typed[i] === targetText[i]
                ? "correct"
                : "wrong";
        } else if (i === typed.length) {
            className = "current";
        }

        html += `<span class="${className}">${escapeHTML(targetText[i])}</span>`;
    }

    document.getElementById("textDisplay").innerHTML = html;
}

function escapeHTML(char) {
    return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    }[char] || char;
}

function startTest() {

    if (started || finished) return;

    started = true;
    startTime = Date.now();

    input.disabled = false;
    input.focus();

    document.getElementById("startBtn").textContent = "Test Running";

    timer = setInterval(() => {

        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        timeLeft = Math.max(0, totalDuration - elapsed);

        document.getElementById("time").textContent = timeLeft;

        updateStats();

        if (timeLeft <= 0) {
            finishTest();
        }

    }, 200);
}

input.addEventListener("input", () => {

    if (finished) return;

    if (!started) {
        startTest();
    }

    if (input.value.length > targetText.length) {
        input.value = input.value.slice(0, targetText.length);
    }

    displayText();
    updateStats();

    if (input.value === targetText) {
        finishTest();
    }
});

function updateStats() {

    const typed = input.value;

    let correct = 0;
    let mistakes = 0;

    for (let i = 0; i < typed.length; i++) {
        if (typed[i] === targetText[i]) {
            correct++;
        } else {
            mistakes++;
        }
    }

    const elapsed = started
        ? Math.max(0.001, (Date.now() - startTime) / 60000)
        : 0;

    const wpm = elapsed > 0
        ? Math.round((correct / 5) / elapsed)
        : 0;

    const accuracy = typed.length > 0
        ? (correct / typed.length) * 100
        : 100;

    document.getElementById("wpm").textContent = wpm;
    document.getElementById("accuracy").textContent =
        accuracy.toFixed(1) + "%";
    document.getElementById("mistakes").textContent = mistakes;
    document.getElementById("characters").textContent = typed.length;

    const progress = Math.min(
        (typed.length / targetText.length) * 100,
        100
    );

    document.getElementById("progress").style.width = progress + "%";
}

function finishTest() {

    if (finished) return;

    finished = true;
    clearInterval(timer);

    input.disabled = true;

    updateStats();

    document.getElementById("startBtn").textContent = "Completed";

    const wpm = document.getElementById("wpm").textContent;
    const accuracy = document.getElementById("accuracy").textContent;
    const mistakes = document.getElementById("mistakes").textContent;
    const characters = document.getElementById("characters").textContent;

    document.getElementById("resultDetails").innerHTML =
        `Your Typing Speed: <b>${wpm} WPM</b><br>
         Accuracy: <b>${accuracy}</b><br>
         Total Mistakes: <b>${mistakes}</b><br>
         Characters Typed: <b>${characters}</b>`;

    document.getElementById("result").style.display = "block";
}

function resetTest() {

    clearInterval(timer);

    started = false;
    finished = false;
    startTime = null;

    totalDuration = Number(document.getElementById("duration").value);
    timeLeft = totalDuration;

    input.value = "";
    input.disabled = false;

    document.getElementById("time").textContent = timeLeft;
    document.getElementById("wpm").textContent = "0";
    document.getElementById("accuracy").textContent = "100%";
    document.getElementById("mistakes").textContent = "0";
    document.getElementById("characters").textContent = "0";
    document.getElementById("progress").style.width = "0%";

    document.getElementById("result").style.display = "none";
    document.getElementById("startBtn").textContent = "Start Test";

    loadPassage();
}

document.getElementById("difficulty").addEventListener("change", resetTest);
document.getElementById("duration").addEventListener("change", resetTest);

resetTest();

</script>

</body>
</html>
